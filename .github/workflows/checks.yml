name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - run: python scripts/verify_artifacts.py
      - run: node scripts/check_dashboard_syntax.mjs
  real-data:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip install -e '.[dev]'
      - run: cp reports/analysis.json /tmp/baseline.json
      - run: python -m claimscope.pipeline
      - run: python scripts/compare_analysis.py /tmp/baseline.json reports/analysis.json
      - run: python -m pytest -q
      - run: python scripts/verify_artifacts.py
      - run: node scripts/check_dashboard_syntax.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: rebuilt-evidence
          path: reports/
